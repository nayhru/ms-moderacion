spring.application.name=ms-moderacion
server.port=8083

# Los datos sensibles se leen desde el archivo .env (ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Conexion a Oracle Cloud mediante wallet
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# La base gratuita admite pocas sesiones: el pool se mantiene chico
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=300000

# Las tablas se crean con los scripts de la carpeta database; Hibernate solo las valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Clave compartida con ms-usuarios para validar el token
app.jwt.secreto=${JWT_SECRET}

# Dominios externos autorizados a consumir la API
app.cors.origenes=http://localhost:3000,http://localhost:4200

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Niveles de log
logging.level.root=INFO
logging.level.com.foro.moderacion=DEBUG
